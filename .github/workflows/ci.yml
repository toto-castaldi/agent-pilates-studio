name: Integrazione continua

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configura Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
      - name: Installa dipendenze
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test unitari
        run: npm test
      - name: Build
        run: npm run build

  publish:
    name: Pubblicazione immagini
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Accesso a GHCR
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ github.token }}
      - name: Costruisci, controlla e pubblica
        run: bash scripts/publish-images.sh ghcr.io/toto-castaldi/agent-pilates-studio "$GITHUB_SHA" --push
