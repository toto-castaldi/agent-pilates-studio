name: Integrazione continua

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate e integrazione
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configura Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
      - name: Installa dipendenze
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test unitari
        run: npm test
      - name: Build
        run: npm run build
      - name: Test locali
        run: npm run test:local
      - name: Installa Pi per la prova offline
        run: npm install --global @earendil-works/pi-coding-agent@1.5.0
      - name: Test Pi offline
        run: npm run test:pi
      - name: Test pacchetto Pi fissato
        run: npm run test:pi-package
      - name: Prepara immagini di integrazione
        run: |
          docker compose pull postgres
          docker compose build hermes
      - name: Test PostgreSQL reale e plugin SQL
        run: npm run test:db
      - name: Test gateway Hermes
        run: npm run test:hermes
      - name: Test identità autenticata e broker
        run: npm run test:author
      - name: Test contesto e compattazione
        run: npm run test:compaction
      - name: Test aggiornamento isolato tra versioni
        run: npm run test:upgrade
      - name: Test avvio locale con un comando
        run: npm run test:start
