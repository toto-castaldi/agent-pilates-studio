model:
  default: "${PILATES_MODEL}"
  provider: openrouter
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ""
plugins:
  enabled:
    - pilates-postgres
platform_toolsets:
  whatsapp_cloud:
    - studio-postgres
tools:
  tool_search:
    enabled: "off"
agent:
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - skills
    - delegation
    - cronjob
    - computer_use
    - connections
