model:
  default: "${PILATES_MODEL}"
  provider: openrouter
privacy:
  # Keep phone-based session and home-channel identifiers out of model prompts.
  redact_pii: true
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ""
onboarding:
  # Independent of memory flags; keep a string (YAML false is not accepted).
  profile_build: "off"
plugins:
  enabled:
    - pilates-postgres
platform_toolsets:
  whatsapp_cloud:
    - studio-postgres
    - skills
tools:
  tool_search:
    enabled: "off"
agent:
  # Operator-owned (PILATES_REASONING_EFFORT, validated at start, default medium);
  # /model, /reasoning, /fast and /codex-runtime are refused in the chat.
  reasoning_effort: "${PILATES_REASONING_EFFORT}"
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - delegation
    - cronjob
    - computer_use
    - connections
skills:
  template_vars: false
  inline_shell: false
  project_discovery: false
  creation_nudge_interval: 0
curator:
  enabled: false
compression:
  enabled: true
  # Computed at container start from the configured model (40% of its window).
  # Hermes uses the lower of this cap and its own ratio trigger.
  threshold_tokens: "${PILATES_COMPACTION_THRESHOLD_TOKENS}"
  # Inactivity is enforced by pilates_trusted.py from the persisted transcript.
  idle_compact_after_seconds: 0
  # On a failed summary keep the full context instead of dropping turns.
  abort_on_summary_failure: true
  progress_notices: false
auxiliary:
  background_review:
    enabled: false
  # Summaries use the configured model ("auto"). Hermes' OpenRouter fallback lane
  # would otherwise retry with a different model; pin it to the same one.
  openrouter_model: "${PILATES_MODEL}"
display:
  # Users receive only replies, never engine warnings such as compaction errors.
  suppress_warning_notifications: true
