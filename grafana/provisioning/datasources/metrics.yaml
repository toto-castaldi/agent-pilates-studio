# Read-only role limited to the studio_metrics views (US-020).
apiVersion: 1
prune: true
datasources:
  - name: Metriche d'uso
    uid: pilates-metrics
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: studio_grafana
    isDefault: true
    editable: false
    jsonData:
      database: studio
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: $__file{/run/pilates-grafana/db-password}
