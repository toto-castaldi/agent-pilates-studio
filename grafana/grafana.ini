; Overrides of the defaults for the usage metrics dashboard (US-020).
; Credentials come from the private configuration through files.

[server]
http_addr = 0.0.0.0
http_port = 3000

[security]
admin_user = admin
admin_password = $__file{/run/pilates-grafana/admin-password}
disable_gravatar = true
cookie_samesite = strict
content_security_policy = true

[users]
allow_sign_up = false
allow_org_create = false
default_theme = system

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
enabled = false
external_enabled = false

[public_dashboards]
enabled = false

[plugins]
preinstall_disabled = true

[unified_alerting]
enabled = false

[alerting]
enabled = false

[log]
mode = console
level = warn

[date_formats]
default_timezone = Europe/Rome
