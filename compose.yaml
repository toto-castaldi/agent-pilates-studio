name: agent-pilates-v010

# Development builds these images locally. Production sets the published
# references and never builds, so it needs no checkout.
x-hermes-image: &hermes-image ${PILATES_HERMES_IMAGE:-${COMPOSE_PROJECT_NAME:-agent-pilates-v010}-hermes}
x-postgres-image: &postgres-image ${PILATES_POSTGRES_IMAGE:-${COMPOSE_PROJECT_NAME:-agent-pilates-v010}-postgres}
x-grafana-image: &grafana-image ${PILATES_GRAFANA_IMAGE:-${COMPOSE_PROJECT_NAME:-agent-pilates-v010}-grafana}
x-postgres-build: &postgres-build
  context: .
  dockerfile: db/Dockerfile

services:
  postgres:
    image: *postgres-image
    build: *postgres-build
    entrypoint: ["/bin/sh", "/etc/pilates/entrypoint.sh"]
    command: ["postgres", "-c", "hba_file=/etc/pilates/pg_hba.conf"]
    environment:
      POSTGRES_USER: studio_admin
      POSTGRES_DB: studio
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin
    secrets:
      - db_admin
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "3"
    healthcheck:
      # TCP only: initdb's temporary server listens on the Unix socket alone.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U studio_admin -d studio"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  db-bootstrap:
    image: *postgres-image
    build: *postgres-build
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    secrets:
      - db_admin
      - db_migrator
      - db_agent
      - db_broker
      - db_grafana
    logging:
      driver: none
    restart: "no"

  author-broker:
    image: *hermes-image
    build:
      context: .
      dockerfile: hermes/Dockerfile
    entrypoint: ["/opt/pilates/broker-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_broker
      - bridge_token
      - whatsapp_app_secret
      - whatsapp_phone_number_id
      - whatsapp_manager_phone
    tmpfs:
      - /run/pilates-broker:mode=0700
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  hermes:
    image: *hermes-image
    build:
      context: .
      dockerfile: hermes/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      author-broker:
        condition: service_healthy
    environment:
      PILATES_MODEL: ${PILATES_MODEL:-openai/gpt-6.1-terra}
      PILATES_REASONING_EFFORT: ${PILATES_REASONING_EFFORT:-medium}
      # Empty means the documented default; the start command rejects an explicit empty value.
      PILATES_IDLE_COMPACT_SECONDS: ${PILATES_IDLE_COMPACT_SECONDS:-}
      HERMES_TIMEZONE: Europe/Rome
      WHATSAPP_CLOUD_WEBHOOK_HOST: 0.0.0.0
      WHATSAPP_CLOUD_WEBHOOK_PATH: ${WHATSAPP_WEBHOOK_PATH:-/whatsapp/webhook}
    secrets:
      - db_agent
      - bridge_token
      - openrouter_key
      - whatsapp_access_token
      - whatsapp_app_secret
      - whatsapp_verify_token
      - whatsapp_manager_phone
      - whatsapp_phone_number_id
    ports:
      - "127.0.0.1:${WHATSAPP_WEBHOOK_PORT:-18090}:8090"
    volumes:
      - hermes_data:/opt/data
      # SOUL.md, configuration, plugin and skills are not mounted: the image
      # links its own read-only copies into the volume at every start
      # (hermes/release-links.sh), so a restart after a reboot needs no image
      # mount and a new image reaches an existing volume (BUG-004).
    tmpfs:
      - /run/pilates-agent:mode=0700
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  # Usage metrics dashboard (US-020): loopback only, reached with ssh -L; the
  # public hostname routes only the webhook. No volume: provisioning comes from
  # the image and changes made in the interface do not survive recreation.
  grafana:
    image: *grafana-image
    build:
      context: .
      dockerfile: grafana/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - grafana_admin_password
      - db_grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    tmpfs:
      - /run/pilates-grafana:mode=0700
    cap_drop: [ALL]
    # Only the entrypoint uses these, as root, before dropping to the grafana user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped

secrets:
  db_admin:
    file: ${SECRETS_DIR:-./.local/secrets}/db-admin
  db_migrator:
    file: ${SECRETS_DIR:-./.local/secrets}/db-migrator
  db_agent:
    file: ${SECRETS_DIR:-./.local/secrets}/db-agent
  db_broker:
    file: ${SECRETS_DIR:-./.local/secrets}/db-broker
  db_grafana:
    file: ${SECRETS_DIR:-./.local/secrets}/db-grafana
  grafana_admin_password:
    file: ${SECRETS_DIR:-./.local/secrets}/grafana-admin-password
  bridge_token:
    file: ${SECRETS_DIR:-./.local/secrets}/bridge-token
  openrouter_key:
    file: ${SECRETS_DIR:-./.local/secrets}/openrouter-key
  whatsapp_access_token:
    file: ${SECRETS_DIR:-./.local/secrets}/whatsapp-access-token
  whatsapp_app_secret:
    file: ${SECRETS_DIR:-./.local/secrets}/whatsapp-app-secret
  whatsapp_verify_token:
    file: ${SECRETS_DIR:-./.local/secrets}/whatsapp-verify-token
  # The single personal number in the configuration; the home channel derives from it.
  whatsapp_manager_phone:
    file: ${SECRETS_DIR:-./.local/secrets}/whatsapp-manager-phone
  whatsapp_phone_number_id:
    file: ${SECRETS_DIR:-./.local/secrets}/whatsapp-phone-number-id

# One prefix names both volumes, so an environment cannot mix them. Unset, the
# names match the default Compose naming and existing volumes are preserved.
volumes:
  postgres_data:
    name: ${PILATES_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-agent-pilates-v010}}_postgres_data
  hermes_data:
    name: ${PILATES_VOLUME_PREFIX:-${COMPOSE_PROJECT_NAME:-agent-pilates-v010}}_hermes_data
